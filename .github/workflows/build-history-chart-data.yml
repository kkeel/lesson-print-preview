name: Build History Chart Data

on:
  workflow_dispatch:

jobs:
  build-history-chart-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lesson print repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build history chart JSON
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/build-history-chart-data.mjs

      - name: Commit generated history chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/history-charts

          if git diff --cached --quiet; then
            echo "No history chart data changes to commit."
            exit 0
          fi

          git commit -m "Build history chart data"
          git push
